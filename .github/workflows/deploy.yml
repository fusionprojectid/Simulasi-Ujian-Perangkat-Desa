name: Deploy CBT ke GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Izin deployment ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Batasi hanya 1 deployment berjalan dalam satu waktu
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Tahap 1: Verifikasi & Pengujian Otomatis
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Jalankan Seluruh Pengujian CBT Kabupaten Tuban
        run: |
          node test_suite.js
          node test_full_audit.js
          node test_cbt_engine_sim.js
          node test_zero_repetition.js

  # Tahap 2: Deployment Otomatis ke GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Konfigurasi GitHub Pages
        uses: actions/configure-pages@v5

      - name: Bersihkan File .py, Duplikat, & File Non-Web di Luar Folder
        run: |
          echo "Membersihkan file non-web dan file di luar folder sebelum dipublikasikan..."
          # 1. Hapus semua file .py yang berada di luar folder (root direktori)
          rm -f ./*.py

          # 2. Hapus file skrip internal & file pengujian yang berada di luar folder
          rm -f ./sync_github.bat ./sync_github.ps1 ./test_*.js

          # 3. Hapus folder generator python, dev_scratch, dan cache yang tidak ditampilkan di web
          rm -rf ./generator ./dev_scratch ./__pycache__ ./.pytest_cache

          # 4. Jika ada file di luar folder yang sudah ada di dalam folder, hapus yang di luar folder
          for file in *; do
            if [ -f "$file" ]; then
              duplicate_match=$(find assets css js -type f -name "$file" -print -quit 2>/dev/null)
              if [ -n "$duplicate_match" ]; then
                echo "Menghapus file di luar folder karena sudah ada di dalam folder: $file (duplikat dari $duplicate_match)"
                rm -f "$file"
              fi
            fi
          done

          echo "=== Daftar Berkas Web Bersih Siap Unggah ==="
          ls -la

      - name: Unggah Aset Web CBT (index.html, css, js)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
