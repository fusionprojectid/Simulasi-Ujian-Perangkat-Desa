<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Civic Navy Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Golden Emblem Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Vibrant Emerald Check Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Shield Geometry -->
  <path d="M 32 3 
           C 48 3, 58 7, 58 15 
           C 58 39, 44 54, 32 61 
           C 20 54, 6 39, 6 15 
           C 6 7, 16 3, 32 3 Z" 
        fill="url(#bgGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="2.5" 
        filter="url(#shadow)" />

  <!-- Inner Decorative Shield Inset -->
  <path d="M 32 6.5 
           C 45 6.5, 54 10, 54 16.5 
           C 54 37, 42 49, 32 55.5 
           C 22 49, 10 37, 10 16.5 
           C 10 10, 19 6.5, 32 6.5 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-opacity="0.15" 
        stroke-width="1" />

  <!-- Civic Five-Point Golden Star -->
  <polygon points="32,9 33.8,14.2 39.2,14.2 34.8,17.4 36.5,22.6 32,19.4 27.5,22.6 29.2,17.4 24.8,14.2 30.2,14.2" 
           fill="url(#goldGrad)" />

  <!-- Monogram 'TB' (Kabupaten Tuban Civic CAT) -->
  <text x="32" y="40" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="19" 
        font-weight="900" 
        letter-spacing="0.5" 
        fill="#ffffff" 
        text-anchor="middle" 
        filter="url(#shadow)">TB</text>

  <!-- Subtitle Bar (CBT) -->
  <rect x="18" y="44" width="28" height="6.5" rx="3.25" fill="url(#goldGrad)" />
  <text x="32" y="49.2" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="5.5" 
        font-weight="900" 
        letter-spacing="1.5" 
        fill="#0f172a" 
        text-anchor="middle">CBT</text>

  <!-- Digital Success Checkmark Badge (Bottom Right) -->
  <circle cx="48" cy="48" r="9.5" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="1.5" />
  <circle cx="48" cy="48" r="7.5" fill="url(#checkGrad)" />
  <path d="M 44.5 48 L 47 50.5 L 51.5 45.5" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
